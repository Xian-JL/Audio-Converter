name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/playback.mjs
      - run: node tests/export.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Flask>=2.3,<4' numpy packaging
      - run: python scripts/generate_test_fixtures.py
      - run: python -m unittest discover -s tests -p test_melody_score.py
      - run: python -m unittest discover -s tests -p test_basic_harmony.py
      - run: python -m unittest discover -s tests -p test_harmony_timing.py
      - run: python -m unittest discover -s tests -p test_downbeat.py
      - run: python -m unittest discover -s tests -p test_workspace.py -k edit
      - run: python -m unittest discover -s tests -p test_workspace.py -k repeated_phrase
      - run: python -m unittest discover -s tests -p test_workspace.py -k project_restores
      - run: python -m unittest discover -s tests -p test_packaging.py
